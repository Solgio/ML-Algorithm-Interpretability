[project]
name = "ml-algorithm-pipeline"
version = "1.0.0"
description = "A modular pipeline to analyse dataset with a collection of ML algorithm. The integration with SHAP and LLMs generates non-technical explanations to guide in business decision making."
authors = [
    {name = "Solgio",email = "lorenzosoligo04@gmail.com"}
]
license = "Open"
requires-python = ">=3.12"
dependencies = [
    "sklearn (==1.8.0)",
    "seaborn (==0.13.2)",
    "shap (==0.52.0)",
    "xgboost (==3.2.0)",
    "openai (==2.36.0)",
    "optuna (==2.36)",
    "pandas (==3.0.3)",
    "numpy (==2.4.6)",
    "matplotlib (==3.10.9)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
